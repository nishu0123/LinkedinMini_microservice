name: LinkedIn Mini Microservices CI

on:
  push:
    branches:
      - feature/CI

jobs:

  discovery-service:
    name: Build & Push Discovery Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make build script executable
        run: chmod +x build-service.sh

      - name: Build Discovery Service
        run: ./build-service.sh discovery-service docker

      - name: Build Discovery Service Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest \
            -f discovery-service/Dockerfile \
            discovery-service

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Discovery Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest


  api-gateway:
    name: Build & Push API Gateway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make build script executable
        run: chmod +x build-service.sh

      - name: Build API Gateway
        run: ./build-service.sh api-gateway docker

      - name: Build API Gateway Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest \
            -f api-gateway/Dockerfile \
            api-gateway

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push API Gateway Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest




