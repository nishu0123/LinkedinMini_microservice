name: LinkedIn Mini Microservices CI

on:
  push:
    branches:
      - feature/CI

jobs:

  notification-service:
    name: Build & Push Notification Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Notification Service Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/notification-service:latest \
            -f NotificationService/Dockerfile \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Notification Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:latest
  
  

  post-service:
    name: Build & Push Post Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Post Service Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/post-service:latest \
