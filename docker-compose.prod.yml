version: "3.9"

services:
  discovery-service:
    image: nishant2342/discovery-service:latest
    container_name: discovery-service

    ports:
      - "8761:8761"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    restart: unless-stopped

  api-gateway:
    image: nishant2342/api-gateway:latest
    container_name: api-gateway

    ports:
      - "6085:6085"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped