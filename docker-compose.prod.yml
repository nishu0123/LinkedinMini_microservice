version: "3.9"

services:

  notification-service:
    image: nishant2342/notification-service:latest
    container_name: notification-service

    ports:
      - "9039:9039"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped

  post-service:
    image: nishant2342/post-service:latest
    container_name: post-service

    ports:
      - "9032:9032"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped



  uploader-service:
    image: nishant2342/uploader-service:latest
    container_name: uploader-service

    ports:
      - "9057:9057"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped


  user-service:
    image: nishant2342/user-service:latest
    container_name: user-service

    ports:
      - "9030:9030"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped

  connection-service:
    image: nishant2342/connection-service:latest
    container_name: connection-service

    ports:
      - "9040:9040"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped

  discovery-service:
    image: nishant2342/discovery-service:latest
    container_name: discovery-service

    ports:
      - "8761:8761"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    restart: unless-stopped

  api-gateway:
    image: nishant2342/api-gateway:latest
    container_name: api-gateway

    ports:
      - "6085:6085"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-service

    restart: unless-stopped